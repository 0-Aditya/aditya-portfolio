name: Update Reviews Data

on:
  issues:
    types: [opened, closed, edited, deleted, labeled]
  schedule:
    - cron: '0 */2 * * *'  # Every 2 hours
  workflow_dispatch:  # Manual trigger

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Fetch reviews from GitHub Issues
        run: |
          # Fetch issues with "review" label
          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/issues?labels=review&state=open&per_page=100" \
            > reviews-raw.json
          
          # Parse and format the reviews
          echo '[' > reviews-data.json
          jq -r '.[] | {author: (.body | capture("Author: (?<author>[^\\n]+)") | .author // "Anonymous"), text: (.body | capture("Review: (?<text>[^\\n]+)") | .text // ""), date: .created_at, id: .id}' reviews-raw.json | \
          jq -s '.' >> reviews-data.json
          echo ']' >> reviews-data.json
      
      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reviews-data.json
          git diff --staged --quiet || git commit -m "Update reviews data [skip ci]"
          git push
